plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

android {
    compileSdk = 37

    defaultConfig {
        applicationId "dev.benica.infinite_longbox"
        minSdkVersion 24
        targetSdk = 37
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions = ["paid"]
    productFlavors {
        free {
            dimension = "paid"
            applicationIdSuffix = ".free"
            versionNameSuffix = "-free"
        }
        noAds {

        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    ksp {
        arg("room.schemaLocation", "database/schema/")
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
    namespace 'dev.benica.infinite_longbox'
}

dependencies {

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.2'
    implementation 'androidx.paging:paging-runtime-ktx:3.5.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'androidx.room:room-ktx:2.8.5'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'androidx.room:room-paging:2.8.5'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.squareup.picasso:picasso:2.71828'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.2.10'
}